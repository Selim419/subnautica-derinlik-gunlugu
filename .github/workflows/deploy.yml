name: Deploy subpath site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-subpath
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Guard against a swapped base
        run: |
          f=.github/workflows/deploy.yml
          # See the note in the root workflow: the "must be absent" scan runs
          # over the file with this step's own `grep -q` lines removed, or the
          # guard matches the strings it is meant to forbid.
          rest=$(grep -v 'grep -q' "$f")
          grep -q 'npm run build:subpath' "$f" || { echo "::error::subpath site must build with build:subpath"; exit 1; }
          grep -q 'verify-base\.mjs /subnautica-derinlik-gunlugu/$' "$f" || { echo "::error::subpath site must verify against /subnautica-derinlik-gunlugu/"; exit 1; }
          if grep -q 'build:root' <<<"$rest"; then echo "::error::subpath workflow contains build:root - swapped"; exit 1; fi

      - name: Read the pinned source commit
        id: pin
        run: |
          test -s .deploy-source || { echo "::error::.deploy-source is missing or empty"; exit 1; }
          sha="$(tr -d '[:space:]' < .deploy-source)"
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::.deploy-source is not a full commit SHA: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Selim419/subnautica-source
          ref: ${{ steps.pin.outputs.sha }}
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/app/package-lock.json

      - name: Install
        working-directory: source/app
        run: npm ci

      - name: Test base assertion
        working-directory: source/app
        run: npm run test:base

      - name: Build
        working-directory: source/app
        run: npm run build:subpath

      - name: Verify base
        working-directory: source/app
        run: node scripts/verify-base.mjs /subnautica-derinlik-gunlugu/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/app/dist

      - uses: actions/deploy-pages@v4
